<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sports Corner">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sports Corner – Gulf Mall</title>
<style>
  :root{--blue:#0b3d91;--red:#e63946}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#f4f6fa;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column}
  header{background:var(--blue);color:#fff;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  header img{width:30px;height:30px;border-radius:7px}
  header h1{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header button,header a{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;
    padding:8px 11px;font-size:14px;text-decoration:none;cursor:pointer}
  #wrap{flex:1;position:relative}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:#f4f6fa;text-align:center;padding:24px;transition:opacity .3s}
  #splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .spin{width:30px;height:30px;border:3px solid #cfd8ea;border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  #help{display:none;max-width:340px;color:#334;font-size:14px;line-height:1.5}
  #help a{display:inline-block;margin-top:12px;background:var(--red);color:#fff;padding:12px 20px;border-radius:10px;
    text-decoration:none;font-weight:600}
  #offline{display:none;background:#ffe9a8;color:#5a4500;font-size:13px;text-align:center;padding:6px}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>Sports Corner · Gulf Mall</h1>
  <button id="reload" aria-label="Reload">⟳</button>
  <a id="ext" target="_blank" rel="noopener" aria-label="Open full screen">⤢</a>
</header>
<div id="offline">You're offline – reconnect to load the latest data.</div>
<div id="wrap">
  <iframe id="app" allow="clipboard-write" title="Sports Corner app"></iframe>
  <div id="splash">
    <img src="icon-192.png" alt="">
    <div class="spin" id="spin"></div>
    <div id="help">
      Taking longer than usual. If the screen stays blank, you may need to sign in to Google,
      or the script isn't set to allow embedding yet.
      <br><a id="open2" target="_blank" rel="noopener">Open the app directly</a>
    </div>
  </div>
</div>
<script>
  // ▼ Your Apps Script web app link
  const APP_URL = "https://script.google.com/macros/s/AKfycbxEc8qslVBibGoyrOmGmjFQa0HjHS7x6CLILzsjd96tRDG4WnT6s0j8KjIfHyHB8oaLdg/exec";

  const frame = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('ext').href = APP_URL;
  document.getElementById('open2').href = APP_URL;

  let slow;
  function load(){
    splash.style.display='flex'; splash.style.opacity=1;
    document.getElementById('help').style.display='none';
    document.getElementById('spin').style.display='block';
    clearTimeout(slow);
    slow = setTimeout(()=>{document.getElementById('help').style.display='block'},12000);
    frame.src = APP_URL + (APP_URL.includes('?')?'&':'?') + 't=' + Date.now();
  }
  frame.addEventListener('load', ()=>{
    if(!frame.src) return;
    clearTimeout(slow);
    splash.style.opacity=0; setTimeout(()=>splash.style.display='none',300);
  });
  document.getElementById('reload').onclick = load;

  const net=()=>document.getElementById('offline').style.display = navigator.onLine?'none':'block';
  addEventListener('online',()=>{net();load()}); addEventListener('offline',net); net();

  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  load();
</script>
</body>
</html>
